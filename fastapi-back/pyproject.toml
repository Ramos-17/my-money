[project]
name = "fastapi-back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramos-17", email = "gramos0617@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "plaid-python>=44.0.0",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "resend>=2.47.0",
    "sqlalchemy>=2.0.53",
]

[project.scripts]
fastapi-back = "fastapi_back:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
